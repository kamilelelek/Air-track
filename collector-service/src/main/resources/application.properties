spring.application.name=collector-service

openaq.apikey=${OPENAQ_API_KEY}
openaq.base-url=https://api.openaq.org/v3

collector.fetch-interval-ms=1800000
collector.max-reading-age-hours=48
collector.request-delay-ms=1100
collector.locations-limit=100
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true

# compose.yaml lives in the repo root; path is relative to the working directory (collector-service/)
spring.docker.compose.enabled=false
spring.docker.compose.file=../compose.yaml

# Timestamps travel as instants; render them in Polish local time.
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Warsaw