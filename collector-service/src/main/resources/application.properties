spring.application.name=collector-service

openaq.apikey=${OPENAQ_API_KEY}
openaq.base-url=https://api.openaq.org/v3

collector.fetch-interval-ms=1800000
collector.max-reading-age-hours=48
collector.request-delay-ms=1100
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.flyway.url=jdbc:postgresql://localhost:5433/airtrack
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

spring.datasource.url=jdbc:postgresql://localhost:5433/airtrack
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true