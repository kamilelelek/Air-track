services:
  postgres:
    image: 'postgres:latest'
    container_name: airtrack-postgres
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=airtrack'
      - 'POSTGRES_USER=${DB_USER}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
    ports:
      - '5433:5432'
    volumes:
      - airtrack-postgres-data:/var/lib/postgresql

volumes:
  airtrack-postgres-data:
