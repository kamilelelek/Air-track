name: Collector

on:
  schedule:
    # Every 30 minutes (UTC); GitHub may start scheduled runs a few minutes late
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: ./mvnw -B package -DskipTests

      - name: Collect measurements
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: java -jar target/collector-service-0.0.1-SNAPSHOT.jar --collector.run-once=true
